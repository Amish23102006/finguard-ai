name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The runner's bundled pip/setuptools carry known CVEs and pip-audit
      # scans the whole environment, so upgrade the tooling first.
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e . pip-audit
      - run: pip-audit --skip-editable
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
