[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "0.1.0"
description = "Explainable multi-agent financial risk intelligence with digital twins, disagreement scoring and human oversight (synthetic demo data only)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amish Chaturvedi" }]
keywords = ["fintech", "machine-learning", "explainable-ai", "multi-agent-systems", "responsible-ai"]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["finguard"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["finguard.dashboard.*"]
disallow_untyped_defs = false
